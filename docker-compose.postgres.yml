version: "3.9"

services:
  # Primary PostgreSQL server
  pg-primary:
    image: postgres:16
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: my_password
      POSTGRES_DB: mydb
    command: >
      postgres
      -c wal_level=replica
      -c hot_standby=on
      -c max_wal_senders=10
      -c max_replication_slots=10
      -c hot_standby_feedback=on
    volumes:
      - pg_primary_data:/var/lib/postgresql/data
      - ./init-primary.sh:/docker-entrypoint-initdb.d/init-primary.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # First replica
  pg-replica-1:
    image: postgres:16
    depends_on:
      pg-primary:
        condition: service_healthy
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: my_password
    entrypoint: >
      bash -c "
        if [ ! -s /var/lib/postgresql/data/PG_VERSION ]; then
          echo 'Initializing replica from primary…'
          until PGPASSWORD=repl_password pg_basebackup -h pg-primary -U replicator \
            -D /var/lib/postgresql/data -R -X stream -c fast -S replication_slot_1
          do
            echo 'Waiting for primary…'
            sleep 2
          done
          echo 'Backup complete!'
        fi
        docker-entrypoint.sh postgres
      "
    volumes:
      - pg_replica_1_data:/var/lib/postgresql/data

  # Second replica
  pg-replica-2:
    image: postgres:16
    depends_on:
      pg-primary:
        condition: service_healthy
    ports:
      - "5434:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: my_password
    entrypoint: >
      bash -c "
        if [ ! -s /var/lib/postgresql/data/PG_VERSION ]; then
          echo 'Initializing replica from primary…'
          until PGPASSWORD=repl_password pg_basebackup -h pg-primary -U replicator \
            -D /var/lib/postgresql/data -R -X stream -c fast -S replication_slot_2
          do
            echo 'Waiting for primary…'
            sleep 2
          done
          echo 'Backup complete!'
        fi
        docker-entrypoint.sh postgres
      "
    volumes:
      - pg_replica_2_data:/var/lib/postgresql/data

volumes:
  pg_primary_data:
    driver: local
  pg_replica_1_data:
    driver: local
  pg_replica_2_data:
    driver: local
